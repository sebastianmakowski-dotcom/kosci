<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kości - Test</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #fff; padding: 20px; text-align: center; }
        .box { background: #333; padding: 20px; border-radius: 8px; max-width: 400px; margin: 20px auto; }
        input, button { padding: 10px; font-size: 16px; margin: 5px; width: 80%; }
        button { background: #28a745; color: white; border: none; cursor: pointer; }
        #error-box { background: #dc3545; color: white; padding: 10px; margin: 10px auto; max-width: 400px; display: none; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="status" style="font-size: 20px; font-weight: bold; color: red;">🔴 Stan: Rozłączony</div>
    <div id="error-box"></div>

    <div class="box">
        <h2>Test Gry Kości</h2>
        <input type="text" id="name" placeholder="Twoje imię"><br>
        <button onclick="sendJoin()">Dołącz</button>
        <div id="players" style="margin-top: 15px; font-weight: bold;"></div>
    </div>

<script src="/socket.io/socket.io.js"></script>
<script>
    window.onerror = function(msg, url, line) {
        const eb = document.getElementById('error-box');
        eb.style.display = 'block';
        eb.innerHTML = `JS Błąd: ${msg} (Linia: ${line})`;
    };

    const socket = io({ transports: ['websocket', 'polling'] });

    socket.on('connect', () => {
        document.getElementById('status').textContent = '🟢 Stan: Połączony! ID: ' + socket.id;
        document.getElementById('status').style.color = 'lime';
    });

    socket.on('disconnect', () => {
        document.getElementById('status').textContent = '🔴 Stan: Rozłączony';
        document.getElementById('status').style.color = 'red';
    });

    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('room') || 'testroom';

    function sendJoin() {
        const val = document.getElementById('name').value;
        if(val) {
            console.log("Wysyłam joinRoom dla:", val);
            socket.emit('joinRoom', { roomId: roomId, playerName: val });
        }
    }

    socket.on('updateRoom', (room) => {
        console.log("Otrzymano updateRoom:", room);
        const names = room.players.map(p => p.name).join(', ');
        document.getElementById('players').textContent = "Gracze w pokoju: " + names;
    });
</script>
</body>
</html>
