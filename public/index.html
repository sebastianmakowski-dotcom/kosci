<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kości - Diagnostyka</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 10px; color: #333; position: relative; }
        .container { max-width: 950px; margin: 40px auto 0; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .card { background: #f8f9fa; border: 1px solid #dee2e6; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        input[type="text"] { padding: 12px; width: 100%; max-width: 250px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px; }
        button { padding: 12px 18px; font-size: 16px; border: none; border-radius: 5px; background-color: #007bff; color: white; cursor: pointer; margin: 5px; }
        #game-section { display: none; }
        .table-box { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { border: 1px solid #dee2e6; padding: 8px; }
        #debug-log { background: #111; color: #0f0; padding: 15px; margin-top: 30px; border-radius: 5px; text-align: left; font-family: monospace; font-size: 13px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎲 Kości (Tryb Diagnostyczny)</h1>

    <div id="lobby-section" class="card">
        <h3>Pokój: <span id="room-id-display"></span></h3>
        <div>
            <input type="text" id="player-name" placeholder="Wpisz imię...">
            <button id="join-btn" onclick="joinRoom()">Wejdź do gry</button>
        </div>
        <div id="waiting-area" style="display:none; margin-top: 15px;">
            <h4>Osoby w grze:</h4>
            <ul id="lobby-players-list"></ul>
            <button id="btn-start" onclick="socket.emit('startGame')" style="background-color: #28a745; display:none;">Start!</button>
        </div>
    </div>

    <div id="game-section">
        <h2 id="turn-info">Tura: </h2>
        <div class="card">
            <p>Pozostało rzutów: <strong id="rolls-left">3</strong></p>
            <div id="dice-container" style="font-size: 24px; margin: 10px 0; font-weight:bold;"></div>
            <button id="roll-btn" onclick="socket.emit('roll')">Rzuć</button>
        </div>
        <div class="table-box">
            <table id="score-table">
                <thead><tr id="table-header"></tr></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- CZARNA KONSOLA DIAGNOSTYCZNA -->
    <div id="debug-log">Logi systemowe:<br></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    function logDebug(msg) {
        const logBox = document.getElementById('debug-log');
        const time = new Date().toLocaleTimeString();
        logBox.innerHTML += `[${time}] ${msg}<br>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    logDebug("Inicjalizacja skryptu...");
    const socket = io();
    let myId = null;
    let currentRoomId = null;

    socket.on('connect', () => { 
        myId = socket.id; 
        logDebug(`✅ Połączono z serwerem. Moje ID: ${myId}`);
    });

    socket.on('disconnect', () => logDebug("❌ Rozłączono z serwerem."));

    const urlParams = new URLSearchParams(window.location.search);
    currentRoomId = urlParams.get('room');
    if (!currentRoomId) {
        currentRoomId = Math.random().toString(36).substring(2, 8);
        window.history.replaceState({}, '', '?room=' + currentRoomId);
        logDebug(`Wygenerowano nowy kod pokoju: ${currentRoomId}`);
    } else {
        logDebug(`Odczytano pokój z URL: ${currentRoomId}`);
    }
    document.getElementById('room-id-display').textContent = currentRoomId;

    function joinRoom() {
        const name = document.getElementById('player-name').value.trim();
        if (name) {
            logDebug(`Wysyłam prośbę o dołączenie. Imię: ${name}, Pokój: ${currentRoomId}`);
            socket.emit('joinRoom', { roomId: currentRoomId, playerName: name });
            document.getElementById('player-name').disabled = true;
            document.getElementById('join-btn').disabled = true;
            document.getElementById('waiting-area').style.display = 'block';
        }
    }

    socket.on('updateRoom', (room) => {
        logDebug(`Odebrano updateRoom! Pokój z serwera: ${room?.id || 'Brak ID'}, Liczba graczy: ${room?.players?.length || 0}`);
        
        if (!room) {
            logDebug("⚠️ BŁĄD: Otrzymano pusty obiekt pokoju.");
            return;
        }

        if (room.id !== currentRoomId) {
            logDebug(`⚠️ Zignorowano update (Pokój się nie zgadza. Oczekiwano: ${currentRoomId}, Otrzymano: ${room.id})`);
            return;
        }

        // Aktualizacja listy
        logDebug("Generowanie listy graczy w UI...");
        document.getElementById('lobby-players-list').innerHTML = room.players.map(p => `<li>${p.name}</li>`).join('');
        
        if (room.players.length > 0 && !room.gameState.started) {
            document.getElementById('btn-start').style.display = 'inline-block';
        }

        if (room.gameState && room.gameState.started) {
            logDebug("Gra wystartowała. Renderowanie stołu...");
            document.getElementById('lobby-section').style.display = 'none';
            document.getElementById('game-section').style.display = 'block';
            document.getElementById('rolls-left').textContent = room.gameState.rollsLeft;
            document.getElementById('dice-container').textContent = room.gameState.dice.join(' | ');
        }
    });
</script>
</body>
</html>
